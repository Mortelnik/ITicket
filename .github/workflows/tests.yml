name: tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Download dataset (sha256-checked)
        run: uv run python scripts/download_data.py

      - name: Run tests
        run: uv run pytest -q

      - name: Validate dataset and recorded splits
        run: uv run python scripts/check_data.py --output experiments/data_validation.json

      - name: Verify saved model metrics
        run: uv run python scripts/evaluate_model.py --output experiments/artifact_validation.json

      - name: Build Docker image
        run: docker build -t iticket:ci .

      - name: Start service and check HTTP contract
        run: |
          docker run -d --name iticket-ci -p 127.0.0.1:8000:8000 iticket:ci
          uv run python scripts/smoke_api.py --url http://127.0.0.1:8000 --wait-seconds 60

      - name: Container logs
        if: always()
        run: docker logs iticket-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f iticket-ci || true
